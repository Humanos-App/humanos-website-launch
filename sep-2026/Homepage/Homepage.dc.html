<helmet>
  <link rel="stylesheet" href="_ds/humanos-design-system-d139d61e-42c3-40a5-bbe8-86256f089249/colors_and_type.css">
  <link rel="stylesheet" href="_ds/humanos-design-system-d139d61e-42c3-40a5-bbe8-86256f089249/styles.css">

  <script src="./scroll-stage.js"></script>
  <style>
    /* ── scroll stage ─────────────────────────────────────────
       Every component paints its own tone (the publisher writes it from
       components.json), so the page is readable at any scroll position on
       its own. <body> follows the active component too, which only shows in
       the overscroll margins above and below the document. */
    body {
      transition: background-color 520ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      body { transition: none; }
    }
    a { color: var(--hm-verification); text-decoration: none; }
    a:hover { color: var(--hm-authority); }
    div.sc-host[data-sc-name="Homepage"] { font-size: 0; }

    /* ── customer marquee ──────────────────────────────────────
       Cloned from the live site's Logos section. Two identical groups
       scroll as one track; the animation translates by -50%, so the
       second group is exactly where the first began and the seam is
       never visible. */
    .hmc-marquee {
      position: relative;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
    }
    .hmc-track {
      display: flex;
      width: max-content;
      align-items: stretch;
      animation: hmcScroll 70s linear infinite;
      will-change: transform;
    }
    .hmc-marquee:hover .hmc-track { animation-play-state: paused; }
    @keyframes hmcScroll {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-50%, 0, 0); }
    }
    .hmc-group { display: flex; flex: 0 0 auto; }
    .hmc-cell {
      flex: 0 0 auto;
      width: 260px;
      padding: 24px 28px;
      box-sizing: border-box;
      /* Fixed 3-row grid keeps the tag, brand and description slots on the
         same baselines across every cell, whether the brand renders as an
         image or as text. */
      display: grid;
      grid-template-rows: 16px 40px 32px;
      row-gap: 12px;
      justify-items: start;
      align-content: center;
      align-items: center;
      border-right: 1px solid var(--hm-line);
      text-decoration: none;
      color: inherit;
    }
    .hmc-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--hm-ink-4);
      font-weight: 500;
      align-self: center;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* grayscale + brightness(0) collapses every logo to pure black; multiply
       then dissolves white logo backgrounds into the cream page. */
    .hmc-img {
      display: block;
      max-height: 40px;
      max-width: 100%;
      width: auto;
      height: auto;
      align-self: center;
      object-fit: contain;
      object-position: left center;
      filter: grayscale(1) brightness(0);
      mix-blend-mode: multiply;
      opacity: 0.7;
      transition: opacity 160ms cubic-bezier(0.2, 0, 0, 1);
    }
    a.hmc-cell:hover .hmc-img { opacity: 1; }
    .hmc-name {
      display: flex;
      align-items: center;
      height: 100%;
      font-family: var(--font-sans);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--hm-authority);
      transition: color 160ms cubic-bezier(0.2, 0, 0, 1);
    }
    a.hmc-cell:hover .hmc-name { color: var(--hm-verification); }
    .hmc-desc {
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.4;
      letter-spacing: 0.005em;
      color: var(--hm-ink-2);
      max-width: 100%;
      align-self: start;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @media (prefers-reduced-motion: reduce) {
      .hmc-track { animation: none; }
    }

    /* ── hero globe ───────────────────────────────────────────
       The canvas is square and centred; the panel it sits in is not, so
       the wrapper does the centring and the canvas takes the smaller of
       the two axes. */
    .hmc-globe-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      /* a size container, so the canvas can ask for the smaller of the two
         axes (cqmin) and stay square in a panel that is not */
      container-type: size;
    }
    .hmc-globe {
      width: 100cqmin;
      height: 100cqmin;
      display: block;
    }
    /* No container-query support: fall back to the panel's height, which is
       the constrained axis in the hero's side-by-side layout. */
    @supports not (container-type: size) {
      .hmc-globe { width: auto; height: 100%; aspect-ratio: 1 / 1; }
    }
    @keyframes kriPanelIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes eiPulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.65; } }
    @keyframes eiFloat { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-3px) rotate(var(--r, 0deg)); } }
    @keyframes eiShimmer { 0% { left: -40%; } 100% { left: 100%; } }
    @keyframes askFlow { to { background-position-y: 8px; } }
    @keyframes nvFlowIn { to { stroke-dashoffset: -24; } }
    @keyframes nvFlowOut { to { stroke-dashoffset: 24; } }
  </style>
</helmet>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static PROMPTS = {
    Claude: "Install the Humanos SDK in this project and configure the Humanos Risk Score for its AI agents. Identify agent actions that create economic exposure and instrument them so Humanos can continuously risk-score their activity. Preserve existing agent behavior and controls, follow the official Humanos integration documentation, and verify that risk events are successfully reaching Humanos.",
    Cursor: null,
    Codex: null,
    Windsurf: null,
  };

  static BASE_PROMPT = "Install the Humanos SDK in this project and configure the Humanos Risk Score for its AI agents. Identify agent actions that create economic exposure and instrument them so Humanos can continuously risk-score their activity. Preserve existing agent behavior and controls, follow the official Humanos integration documentation, and verify that risk events are successfully reaching Humanos.";

  state = { progress: 0, progress2: 0, enfTick: 0, storyIdx: 0, solutionsOpen: false, agent: 'Claude', copied: false, tip: false, hoverAgent: null, pillClosed: false, narrow: typeof window !== 'undefined' && window.innerWidth < 720, probT: 0, solT: 0, kriStep: 0, kriT: 0, riWho: null, riT: 0, headT: 0 };

  static PROB_EVENTS = [
    { label: '+$50K payment', risk: 24, ok: false },
    { label: 'New destination', risk: 41, ok: false },
    { label: 'Human Authorization ✔', risk: 19, ok: true },
    { label: 'Authority expanded', risk: 38, ok: false },
    { label: 'Transaction limit enforced ✔', risk: 16, ok: true },
    { label: 'Human Authorization missing', risk: 67, ok: false },
    { label: 'Policy re-evaluated ✔', risk: 34, ok: true },
    { label: 'New counterparty', risk: 52, ok: false },
    { label: 'Scope narrowed ✔', risk: 21, ok: true },
    { label: '+$180K payment', risk: 45, ok: false },
  ];
  static PROB_STEP = 1.35;
  static PROB_LOOP = 1.35 * 11;

  probVals() {
    this.ensureClock();
    const T = this.state.probT || 0;
    const ez = 'cubic-bezier(0.2,0,0,1)';
    const evs = Component.PROB_EVENTS;
    const step = Component.PROB_STEP;
    const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);

    const pts = [{ risk: 18 }];
    for (let i = 0; i < evs.length; i++) pts.push({ risk: evs[i].risk, label: evs[i].label, ok: evs[i].ok, t: (i + 1) * step });

    const idx = Math.min(evs.length, Math.floor(T / step));
    const frac = ease((T - idx * step) / step);
    const cur = idx === 0 ? 18 : pts[idx].risk;
    const nxt = idx < evs.length ? pts[idx + 1].risk : cur;
    const live = Math.round(cur + (nxt - cur) * frac);

    // chart geometry
    const W = 100, H = 100, n = evs.length + 1;
    const xAt = (i) => (i / (n - 1)) * W;
    const yAt = (r) => H - (Math.min(100, r) / 100) * H;
    const path = [];
    for (let i = 0; i <= idx; i++) path.push([xAt(i), yAt(pts[i].risk)]);
    if (idx < evs.length) {
      const x = xAt(idx) + (xAt(idx + 1) - xAt(idx)) * frac;
      path.push([x, yAt(live)]);
    }
    const d = path.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
    const area = d + ' L' + path[path.length - 1][0].toFixed(2) + ' ' + H + ' L' + path[0][0].toFixed(2) + ' ' + H + ' Z';
    const h = React.createElement;
    const chart = h('svg', {
      viewBox: '0 0 100 100', preserveAspectRatio: 'none',
      style: { width: '100%', height: '100%', display: 'block', overflow: 'visible' },
    }, [
      ...[25, 50, 75].map((r) => h('line', { key: 'g' + r, x1: 0, y1: yAt(r), x2: 100, y2: yAt(r), stroke: '#EFEDE7', strokeWidth: 1, vectorEffect: 'non-scaling-stroke' })),
      h('line', { key: 'gb', x1: 0, y1: yAt(18), x2: 100, y2: yAt(18), stroke: '#DDD9D0', strokeWidth: 1, strokeDasharray: '3 3', vectorEffect: 'non-scaling-stroke' }),
      h('line', {
        key: 'now', x1: path[path.length - 1][0], y1: 0, x2: path[path.length - 1][0], y2: H,
        stroke: '#4B49CA', strokeWidth: 1, strokeDasharray: '3 3', strokeOpacity: 0.55, vectorEffect: 'non-scaling-stroke',
      }),
      h('path', { key: 'p', d, fill: 'none', stroke: '#4B49CA', strokeWidth: 1.5, strokeLinejoin: 'round', strokeLinecap: 'round', vectorEffect: 'non-scaling-stroke' }),
      ...path.slice(0, -1).flatMap((p, i) => [
        h('path', { key: 'mo' + i, d: 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + 'l0 0', stroke: '#4B49CA', strokeWidth: 6, strokeLinecap: 'round', vectorEffect: 'non-scaling-stroke' }),
        h('path', { key: 'mi' + i, d: 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + 'l0 0', stroke: '#FFFFFF', strokeWidth: 3.4, strokeLinecap: 'round', vectorEffect: 'non-scaling-stroke' }),
      ]),
      h('path', {
        key: 'cur',
        d: 'M' + path[path.length - 1][0].toFixed(2) + ' ' + path[path.length - 1][1].toFixed(2) + 'l0 0',
        stroke: '#4B49CA', strokeWidth: 8, strokeLinecap: 'round', vectorEffect: 'non-scaling-stroke',
      }),
    ]);

    const startSec = 41 * 60 + 2;
    const shown = [];
    for (let i = Math.max(0, idx - 3); i < idx; i++) {
      void 0;
      const total = startSec + (i + 1) * 7;
      const mm = String(Math.floor(total / 60)).padStart(2, '0');
      const ss = String(total % 60).padStart(2, '0');
      shown.push({
        blank: false,
        stamp: '10:' + mm + ':' + ss,
        label: evs[i].label,
        risk: 'RISK ' + evs[i].risk,
        up: i === 0 ? false : evs[i].risk > evs[i - 1].risk,
        ok: evs[i].ok,
        fresh: i === idx - 1,
      });
    }
    while (shown.length < 3) shown.unshift({ blank: true, stamp: '', label: '', risk: '', up: false, ok: false, fresh: false });

    const probUp = idx === 0 ? false : nxt > cur || (idx >= evs.length && cur > (evs.length > 1 ? evs[evs.length - 2].risk : 18));
    return {
      probScore: String(live),
      probScoreStyle: {
        fontFamily: 'var(--font-mono)', fontSize: '48px', fontWeight: 700,
        lineHeight: 1, letterSpacing: '-0.03em', fontVariantNumeric: 'tabular-nums',
        color: probUp ? 'var(--hm-rejection)' : 'var(--hm-verification)',
        transition: 'color 260ms ' + ez,
      },
      probChart: chart,
      probDivergeText: '18 ≠ ' + live,
      probDivergeStyle: {
        fontFamily: 'var(--font-mono)', fontSize: '11px', fontWeight: 700,
        letterSpacing: '0.07em', textTransform: 'uppercase', whiteSpace: 'nowrap',
        color: 'var(--hm-verification)', border: '1px solid var(--hm-verification)',
        borderRadius: '2px', padding: '3px 8px', marginLeft: 'auto',
        opacity: idx >= 3 ? 1 : 0,
        transition: 'opacity 300ms ' + ez,
      },
      probEvents: shown.map((e, i) => ({
        stamp: e.stamp,
        label: e.label,
        risk: e.risk,
        rowStyle: {
          display: 'flex', alignItems: 'center', gap: '14px',
          height: '25px', boxSizing: 'border-box', padding: '4px 0',
          borderBottom: e.blank || i === shown.length - 1 ? 'none' : '1px solid var(--hm-line)',
          opacity: e.blank ? 0 : (e.fresh ? Math.min(1, 0.35 + frac * 1.3) : 1),
          transition: 'opacity 200ms linear',
        },
        riskStyle: {
          fontFamily: 'var(--font-mono)', fontSize: '11px', fontWeight: 700,
          marginLeft: 'auto', whiteSpace: 'nowrap',
          color: e.up ? 'var(--hm-rejection)' : 'var(--hm-verification)',
        },
      })),
    };
  }

  static SOL_LOOP = 12.0;

  solVals() {
    this.ensureClock();
    const T = this.state.solT || 0;
    const ez = 'cubic-bezier(0.2,0,0,1)';
    const seg = (a, b) => Math.min(1, Math.max(0, (T - a) / (b - a)));
    const ease = (x) => 1 - Math.pow(1 - x, 3);
    const fade = (at, dy) => ({
      opacity: T >= at ? 1 : 0,
      transform: T >= at ? 'translateY(0)' : 'translateY(' + (dy || 8) + 'px)',
      transition: 'opacity 380ms ' + ez + ', transform 380ms ' + ez,
    });
    const wire = (a, b) => ({
      position: 'relative', flex: '0 1 70px', minWidth: '24px', alignSelf: 'center', height: '1px',
      background: T >= b ? 'var(--hm-verification)' : 'var(--hm-line-strong)',
      transition: 'background 300ms ' + ez,
    });
    const dot = (a, b) => ({
      position: 'absolute', top: '-3px', left: (seg(a, b) * 100) + '%',
      width: '7px', height: '7px', marginLeft: '-3px', borderRadius: '50%',
      background: 'var(--hm-verification)',
      opacity: T >= a && T <= b + 0.15 ? 1 : 0,
      transition: 'opacity 160ms linear',
    });
    const chip = (on, hero) => ({
      fontFamily: 'var(--font-mono)', fontSize: '9.5px', fontWeight: 700,
      letterSpacing: '0.07em', textTransform: 'uppercase', whiteSpace: 'nowrap',
      padding: '5px 9px', borderRadius: '2px',
      color: hero ? '#FFFFFF' : 'var(--hm-ink-2)',
      background: hero ? 'var(--hm-verification)' : 'transparent',
      border: '1px solid ' + (hero ? 'var(--hm-verification)' : 'var(--hm-line-strong)'),
      opacity: on ? 1 : 0,
      transform: on ? 'translateY(0)' : 'translateY(4px)',
      transition: 'opacity 240ms ' + ez + ', transform 240ms ' + ez,
    });

    const rise = ease(seg(1.9, 2.7));
    const drop = ease(seg(4.0, 4.9));
    const score = Math.max(0, Math.round(38 * rise - 25 * drop));
    const reduced = T >= 4.3;

    const knowVals = [18, 24, 41, 19, 38, 26];
    const knowIdx = Math.min(knowVals.length, Math.floor(seg(0.6, 5.6) * knowVals.length) + 1);

    const redDrop = ease(seg(4.0, 4.9));
    const redScore = Math.round(38 - 25 * redDrop);
    const redCtrls = [
      { t: 3.0, label: 'Human Authorization' },
      { t: 3.5, label: 'Transaction Limit enforced' },
      { t: 4.0, label: 'Runtime Policy applied' },
    ];
    const bidRows = [
      { t: 6.4, name: 'Insurer A', terms: 'Bid received' },
      { t: 7.0, name: 'Insurer B', terms: 'Bid received' },
      { t: 7.6, name: 'Insurer C', terms: 'Bid received' },

  kriChart(prog) {
    const pts = Component.KRI_TRACK;
    const W = 420, H = 120, pad = 10;
    const n = pts.length;
    const live = Math.max(1, Math.min(n, Math.round(1 + (n - 1) * prog)));
    const xAt = (i) => pad + (i / (n - 1)) * (W - pad * 2);
    const yAt = (v) => pad + (1 - (v - 8) / 26) * (H - pad * 2);
    let d = '';
    for (let i = 0; i < live; i++) d += (i ? ' L' : 'M') + xAt(i).toFixed(1) + ' ' + yAt(pts[i]).toFixed(1);
    const cx = xAt(live - 1), cy = yAt(pts[live - 1]);
    const el = React.createElement;
    return el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: '100%', preserveAspectRatio: 'none', key: 'kc' }, [
      el('line', { key: 'g1', x1: pad, x2: W - pad, y1: yAt(26), y2: yAt(26), stroke: 'var(--hm-line)', strokeWidth: 1 }),
      el('line', { key: 'g2', x1: pad, x2: W - pad, y1: yAt(17), y2: yAt(17), stroke: 'var(--hm-line)', strokeWidth: 1 }),
      el('path', { key: 'p', d: d, fill: 'none', stroke: 'var(--hm-verification)', strokeWidth: 1.6, strokeLinejoin: 'round' }),
      el('line', { key: 'v', x1: cx, x2: cx, y1: pad, y2: H - pad, stroke: 'var(--hm-verification)', strokeWidth: 1, strokeDasharray: '3 4', opacity: 0.5 }),
      el('circle', { key: 'c', cx: cx, cy: cy, r: 4, fill: 'var(--hm-verification)' }),
    ]);
  }

    const span = Component.KRI_SPAN;

    const auto = Math.floor(T / span) % 4;
    const active = held ? (this.state.kriStep || 0) : auto;
    const p = held ? Math.min(span, (Date.now() - this.kriHold) / 1000) : (T - Math.floor(T / span) * span);

    const knowScore = Component.KRI_TRACK[Math.max(0, Math.min(Component.KRI_TRACK.length - 1, Math.round((Component.KRI_TRACK.length - 1) * knowProg)))];
    const reduceScore = Math.round(38 - 25 * ease((p - 2.8) / 1.6));
    const decided = p >= 3.4;

    const panel = (idx) => ({

     when the export is published, so the publisher leaves a base here and we

  static assetBase() {

  /* The page background follows the section being read. Mounted against the
     document rather than through a ref: refs fire bottom-up as React attaches
     nodes, so a ref on the outer wrapper races the helmet script that defines
     the module. Scoping to <body> sidesteps the ordering entirely. */
  mountScrollTone() {
    if (this.toneHandle || typeof window === 'undefined') return;
    if (!window.HumanosScrollStage) {
      /* helmet scripts can still be loading; try again on the next tick */
      if ((this._toneTries = (this._toneTries || 0) + 1) <= 40) setTimeout(() => this.mountScrollTone(), 50);
      return;
    }
    this.toneHandle = window.HumanosScrollStage.mount(document.body);

  observeProb() {
    if (this.probObs) { this.probObs.disconnect(); this.probObs = null; }
    if (!this.probEl || typeof IntersectionObserver === 'undefined') return;
    this.probObs = new IntersectionObserver((entries) => {
      const e = entries[entries.length - 1];
      if (!e) return;
      this.probVisible = e.isIntersecting;
    }, { threshold: [0, 0.2] });
    this.probObs.observe(this.probEl);

  ensureClock() {
    this._clk = this._clk || { prob: 0, sol: 0, kri: 0, ri: 0, last: null, at: 0 };
    // watchdog: re-arm if the scheduler was stranded (hot reload, cleared timers)
    if (Date.now() - (this._clk.at || 0) > 300) this.armClock();
  }

  armClock() {
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._timer) clearInterval(this._timer);
    if (this._raf) cancelAnimationFrame(this._raf);
    const self = this;
    const frame = function () {
      self._raf = requestAnimationFrame(frame);
      self.clockTick();
    };
    this._raf = requestAnimationFrame(frame);
    this._timer = setInterval(function () { self.clockTick(); }, 120);
  }

  clockTick = () => {
    const C = this._clk;
    if (!C) return;
    const now = Date.now();
    if (now - (C.at || 0) < 45) return;
    C.at = now;
    if (C.last == null) C.last = now;
    const dt = Math.min(0.25, (now - C.last) / 1000);
    C.last = now;
    if (this.probVisible !== false) { C.prob += dt; if (C.prob >= Component.PROB_LOOP) C.prob = 0; }
    if (this.solVisible !== false) { C.sol += dt; if (C.sol >= Component.SOL_LOOP) C.sol = 0; }
    if (this.riVisible !== false) { C.ri += dt; if (C.ri >= Component.RI_LOOP) C.ri = 0; }
    C.dev = (C.dev || 0) + dt;
    if (C.dev >= 5.2) { C.dev = 0; this.advanceDevTab(); }
    this.updatePillTone();
    C.head = (C.head || 0) + dt;
    if (C.head >= 8.8) C.head = 0;
    if (this.kriVisible === true) { C.kri += dt; if (C.kri >= Component.KRI_LOOP) C.kri = 0; }
    this.setState({ probT: C.prob, solT: C.sol, kriT: C.kri, riT: C.ri, headT: C.head });
  };

  startProb() { this.ensureClock(); }

  updateProgress = () => {
    const vh = window.innerHeight;
    const updates = {};
    if (this.sectionEl) {
      const rect = this.sectionEl.getBoundingClientRect();
      const total = rect.height - vh;
      const p = total > 0 ? Math.min(1, Math.max(0, -rect.top / total)) : 0;
      if (p !== this.state.progress) updates.progress = p;
    }
    if (this.section2El) {
      const rect2 = this.section2El.getBoundingClientRect();
      const total2 = rect2.height - vh;
      const p2v = total2 > 0 ? Math.min(1, Math.max(0, -rect2.top / total2)) : 0;
      if (p2v !== this.state.progress2) updates.progress2 = p2v;
    }
    if (Object.keys(updates).length) this.setState(updates);
  };

  componentDidMount() {
    window.addEventListener('scroll', this.updateProgress, { passive: true });
    window.addEventListener('resize', this.updateProgress);
    window.addEventListener('resize', this.updateNarrow);
    window.addEventListener('resize', this.forceUpdate.bind(this, undefined));
    window.addEventListener('scroll', this.updatePillTone, { passive: true });
    window.addEventListener('resize', this.updatePillTone);
    this.updateProgress();
    this.updatePillTone();
    this.enfTimer = setInterval(() => this.setState(s => ({ enfTick: s.enfTick + 1 })), 60);

    if (typeof document === 'undefined' || !document.elementsFromPoint) return;
    const y = window.innerHeight - 58;
    const x = Math.round(window.innerWidth / 2);
    let stack = [];
    try { stack = document.elementsFromPoint(x, y) || []; } catch (e) { return; }
    let dark = false;
    for (let i = 0; i < stack.length; i++) {
      const el = stack[i];
      if (el.closest && el.closest('[data-pill]')) continue;
      const bg = window.getComputedStyle(el).backgroundColor;
      const m = bg && bg.match(/rgba?\(([^)]+)\)/);
      if (!m) continue;
      const p = m[1].split(',').map(function (v) { return parseFloat(v); });
      if (p.length > 3 && p[3] < 0.6) continue;
      const lum = (0.2126 * p[0] + 0.7152 * p[1] + 0.0722 * p[2]) / 255;
      dark = lum < 0.5;
      break;
    }
    this._pillDark = dark;
    this.paintPillTone(dark);
  };

  setPillRef = (el) => {
    this.pillEl = el || null;
    if (el) this.paintPillTone(this._pillDark);
  };

  paintPillTone(dark) {
    const el = this.pillEl;
    if (!el) return;
    el.style.background = dark ? '#FFFFFF' : '#111111';
    const txt = el.firstElementChild;
    if (txt) txt.style.color = dark ? '#111111' : '#F4F3EF';
    const imgs = el.querySelectorAll('img');
    for (let i = 0; i < imgs.length; i++) {
      const isClaude = (imgs[i].getAttribute('alt') || '').indexOf('Claude') === 0;
      imgs[i].style.filter = (!dark && !isClaude) ? 'invert(1)' : 'none';
    }
  }

    window.removeEventListener('scroll', this.updatePillTone);
    window.removeEventListener('resize', this.updatePillTone);
    window.removeEventListener('scroll', this.updateProgress);
    window.removeEventListener('resize', this.updateProgress);
    window.removeEventListener('resize', this.updateNarrow);
    clearInterval(this.enfTimer);
    this.stopProb();
    if (this.probObs) this.probObs.disconnect();
    if (this.solObs) this.solObs.disconnect();
    if (this.riObs) this.riObs.disconnect();
    if (this.globeHandle) { this.globeHandle.destroy(); this.globeHandle = null; }
    if (this.toneHandle) { this.toneHandle.destroy(); this.toneHandle = null; }
    if (this._timer) clearInterval(this._timer);
    if (this._raf) cancelAnimationFrame(this._raf);

  enforcementVals() {
    const CYCLE = 7200;
    const elapsed = Date.now() % CYCLE;
    const phaseBlocked = elapsed < 3600;
    const local = phaseBlocked ? elapsed : elapsed - 3600;
    const clamp01 = x => Math.min(1, Math.max(0, x));
    const lerp = (a, b) => clamp01((local - a) / (b - a));
    const rejection = '#F3797E', verified = '#4B49CA', dimBorder = '#C9C4B7';
    const dark = '#111111';
    const overallFade = 1 - lerp(3200, 3600);
    const decided = local >= 900;

    const pulse1T = lerp(0, 900);
    const pulse2T = lerp(1000, 1900);

    const enfLine1DotOpacity = (phaseBlocked ? 1 : (local < 1000 ? 1 : 0)) * overallFade;
    const enfLine2DotOpacity = (!phaseBlocked && local >= 1000 && local < 1900 ? 1 : 0) * overallFade;

    const enfBoxColor = (decided && !phaseBlocked) ? this.mixColor(overallFade, dimBorder, verified) : dimBorder;
    const enfAllowColor = (!phaseBlocked && decided) ? this.mixColor(overallFade, dark, verified) : dark;
    const enfBlockColor = (phaseBlocked && decided) ? this.mixColor(overallFade, dark, rejection) : dark;
    const enfTargetDotColor = (!phaseBlocked && local >= 1900) ? this.mixColor(overallFade, dimBorder, verified) : dimBorder;

    return {
      enfLine1DotTop: 24 + Math.min(pulse1T, 1) * 34 - 3.5,
      enfLine1DotOpacity,
      enfLine2DotTop: 118 + pulse2T * 34 - 3.5,
      enfLine2DotOpacity,
      enfConnector2Color: (!phaseBlocked && decided) ? this.mixColor(overallFade, dimBorder, verified) : dimBorder,
      enfBoxColor,
      enfAllowColor,
      enfBlockColor,
      enfTargetDotColor,
    };
  }

  p2() {

    const p = Math.min(1, this.state.progress2 * (305 / 175));

  guardrailVals() {
    const BLOCK_LEN = 4500, ALLOW_LEN = 9000;
    const CYCLE = BLOCK_LEN + ALLOW_LEN;
    const elapsed = (this.state.enfTick * 60) % CYCLE;
    const blockedPhase = elapsed < BLOCK_LEN;
    const phaseLen = blockedPhase ? BLOCK_LEN : ALLOW_LEN;
    const local = blockedPhase ? elapsed : elapsed - BLOCK_LEN;
    const clamp01 = x => Math.min(1, Math.max(0, x));
    const lerp = (a, b) => clamp01((local - a) / (b - a));
    const rejection = '#F3797E', verified = '#4B49CA';
    const overallFade = 1 - lerp(phaseLen - 400, phaseLen);

    const labels = ['AI Identity', 'Organization', 'Delegated Authority', 'Human Authorization', 'Runtime Policy'];
    const starts = [700, 1000, 1300, 1600, 1900];
    const guardrails = labels.map((label, i) => {
      const t = lerp(starts[i], starts[i] + 200);
      const bad = i === 4 && blockedPhase;
      return { label, opacity: t * overallFade, tick: t >= 1 ? (bad ? '✕' : '✓') : '', color: bad ? rejection : verified };
    });

    const decisionT = lerp(2300, 2600);
    return {
      guardrails,
      guardrailDecisionOpacity: decisionT * overallFade,
      guardrailDecisionColor: blockedPhase ? rejection : verified,
      guardrailDecisionText: decisionT > 0 ? (blockedPhase ? 'BLOCK' : 'ALLOW') : '',
      guardrailTargetOpacity: (!blockedPhase && local >= 3000 ? 1 : 0) * overallFade,
    };
  }

  mixColor(t, from, to) {

    const r = f.map((v,i) => Math.round(v + (g[i]-v)*t));
    return `rgb(${r[0]},${r[1]},${r[2]})`;
  }

  mix(t, from, to) {
    return from + (to - from) * t;
  }

  connectorPath(cardEl) {
    if (!this.containerEl || !this.moduleEl || !cardEl) return '';
    const c = this.containerEl.getBoundingClientRect();
    const m = this.moduleEl.getBoundingClientRect();
    const k = cardEl.getBoundingClientRect();
    const x1 = m.left + m.width / 2 - c.left;
    const y1 = m.bottom - c.top;
    const x2 = k.left + k.width / 2 - c.left;
    const y2 = k.top - c.top;
    const midY = (y1 + y2) / 2;
    return `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
  }

  pinStyle() {
    const base = {
      left: 0, right: 0, height: '100vh', overflow: 'hidden',
    };
    const sectionHeight = this.sectionEl ? this.sectionEl.getBoundingClientRect().height : 0;
    if (this.state.progress <= 0) return { ...base, position: 'absolute', top: 0 };
    if (this.state.progress >= 1) return { ...base, position: 'absolute', bottom: 0 };
    return { ...base, position: 'fixed', top: 0 };
  }

  resolvedVals() {
    const t = this.resolvedT();
    const rejection = '#F3797E';
    const verified = '#4B49CA';
    const riskScore = Math.round(this.mix(t, 78, 13));
    const premium = Math.round(this.mix(t, 5647, 421));
    const reviews = Math.round(this.mix(t, 184, 0));
    const rate = this.mix(t, 71, 99.6).toFixed(1);
    return {
      finalUnderlineColor: this.mixColor(t, rejection, verified),
      signalColor: this.mixColor(t, rejection, verified),
      signalGlyph: t < 0.5 ? '?' : '✓',
      card1RiskArrow: t < 0.5 ? '↑' : '↓',
      card1RiskScore: riskScore,
      card1PremiumArrow: t < 0.5 ? '↑' : '↓',
      card1Premium: premium.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','),
      card2Status: t < 0.5 ? 'Unknown' : 'Verified',
      card2ReviewsArrow: t < 0.5 ? '↑' : '↓',
      card2Reviews: reviews,
      card3Decision: t < 0.5 ? 'Unknown' : 'Approved',
      card3RateArrow: t < 0.5 ? '↓' : '↑',
      card3Rate: rate,
    };
  }

  renderVals() {
    return {
      ...this.installVals(),
      customers: this.customerCells(),
      setGlobeRef: this.setGlobeRef,
      setProbRef: this.setProbRef,
      setSolRef: this.setSolRef,
      ...this.solVals(),
      ...this.kriVals(),
      ...this.riVals(),
      ...this.askVals(),
      ...this.probVals(),
      activityVolume: this.props.activityVolume ?? '$2.4B',
      setSectionRef: (el) => { this.sectionEl = el; },
      openSolutions: () => this.setState({ solutionsOpen: true }),
      closeSolutions: () => this.setState({ solutionsOpen: false }),
      solutionsOpacity: this.state.solutionsOpen ? 1 : 0,
      solutionsPointerEvents: this.state.solutionsOpen ? 'auto' : 'none',
      setCarouselRef: (el) => { this.carouselEl = el; },
      storyIdx: this.state.storyIdx,
      carouselPrev: () => this.setState(s => ({ storyIdx: Math.max(0, s.storyIdx - 1) })),
      carouselNext: () => this.setState(s => ({ storyIdx: Math.min(2, s.storyIdx + 1) })),
      storyDots: [0, 1, 2].map(i => ({
        color: i === this.state.storyIdx ? 'var(--hm-verification)' : 'var(--hm-line-strong)',
        goTo: () => this.setState({ storyIdx: i }),
      })),
      setContainerRef: (el) => { this.containerEl = el; },
      setModuleRef: (el) => { this.moduleEl = el; },
      setCard1Ref: (el) => { this.card1El = el; },
      setCard2Ref: (el) => { this.card2El = el; },
      setCard3Ref: (el) => { this.card3El = el; },
      setSection2Ref: (el) => { this.section2El = el; },
      boxScaleTransform: `scale(${this.boxScale()})`,
      section2WrapStyle: this.section2WrapStyle(),
      pinStyle2: this.pinStyle2(),
      statementColor: this.statementColor(),
      statementFadeStyle: this.statementFadeStyle(),
      gridBgStyle: this.gridBgStyle(),
      ...this.guardrailVals(),
      panelCodeStyle: this.panelCodeStyle(),
      checklistItems2: this.checklistItems2(),
      enforceCardStyle: this.enforceCardStyle(),
      ...this.enforcementVals(),
      riskIntelStyle: this.riskIntelStyle(),
      ...this.riskIntelVals(),
      panelHumanAuthStyle: this.panelHumanAuthStyle(),
      connectorLineStyle: this.connectorLineStyle(),
      ...this.humanAuthVals(),
      ...this.riskSignalVals(),
      ...this.devApiVals(),
      panelProofStyle: this.panelProofStyle(),
      panelPolicyStyle: this.panelPolicyStyle(),
      panelScoreStyle: this.panelScoreStyle(),
      pinStyle: this.pinStyle(),
      moduleStyle: this.moduleStyle(),
      introStyle: this.introStyle(),
      connectorStyle: this.connectorStyle(),
      connectorPath1: this.connectorPath(this.card1El),
      connectorPath2: this.connectorPath(this.card2El),
      connectorPath3: this.connectorPath(this.card3El),
      layerAStyle: this.layerAStyle(),
      layerBStyle: this.layerBStyle(),
      rowWrapperStyle: this.rowWrapperStyle(),
      messageStyle: this.messageStyle(),
      card1Style: this.cardStyle(0.06, 0.20, 210, '42vh', 'min(300px, 38vh)'),
      card2Style: this.cardStyle(0.10, 0.24),
      card3Style: this.cardStyle(0.14, 0.28),
      ...this.resolvedVals(),
    };
  }
}
</script>
</body>
